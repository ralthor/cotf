[project]
name = "chess-analyser-backend"
version = "0.1.0"
description = "Accounts, game library, sync and cloud Stockfish analysis for the Chess Game Analyser"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    "celery[redis]>=5.7.0",
    "chess>=1.11.2",
    "dj-database-url>=3.1.2",
    "django>=5.2",
    "django-cors-headers>=4.9.0",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.8",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 120
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "BLE"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.4",
]
