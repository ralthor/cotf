# Full stack: web (static), API, Postgres, Redis, sync worker, beat, and an isolated engine worker.
#   cp backend/.env.example backend/.env   # then edit secrets
#   docker compose up --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: analyser
      POSTGRES_USER: analyser
      POSTGRES_PASSWORD: analyser
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyser"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  api:
    build: ./backend
    env_file: backend/.env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports: ["8000:8000"]

  worker-sync:
    build: ./backend
    env_file: backend/.env
    depends_on: [db, redis]
    command: celery -A config worker -Q sync --concurrency 2 --loglevel INFO

  beat:
    build: ./backend
    env_file: backend/.env
    depends_on: [db, redis]
    command: celery -A config beat --loglevel INFO

  worker-engine:
    build:
      context: ./backend
      dockerfile: Dockerfile.engine
    env_file: backend/.env
    depends_on: [db, redis]
    # Resource budget and isolation for CPU-heavy Stockfish jobs.
    cpus: 2
    mem_limit: 2g
    pids_limit: 128
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: http://localhost:8000
    ports: ["8080:80"]

volumes:
  pgdata:
